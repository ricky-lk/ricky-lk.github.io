<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ricky-lk's Tools</title>
  <meta name="description" content="Ricky-lk's Tools">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- ⚡ 立即執行系統深淺色偏好偵測，防止頁面載入時閃爍 (Anti-FOUC) -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('preferred-theme');
        if (savedTheme === 'dark' || savedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', savedTheme);
        } else {
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', systemDark ? 'dark' : 'light');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* 預設明亮模式變數 */
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover-border: #94a3b8;
      --card-hover-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --btn-bg: #f1f5f9;
      --btn-border: #cbd5e1;
      --btn-active-bg: #e2e8f0;
      --accent: #2563eb;
      /* 橙色系 Badge 標籤 (亮色) */
      --badge-bg: #fff7ed;
      --badge-text: #ea580c;
      --badge-border: #fed7aa;
      --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 6px 12px -2px rgba(0, 0, 0, 0.08), 0 3px 6px -3px rgba(0, 0, 0, 0.05);
    }

    /* 系統層面暗黑偏好 (若未手動強制設為 light 則自動套用) */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-color: #1e2430;
        --card-bg: #283040;
        --card-border: #374151;
        --card-hover-border: #64748b;
        --card-hover-bg: #2d3748;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --btn-bg: #222938;
        --btn-border: #374151;
        --btn-active-bg: #334155;
        --accent: #60a5fa;
        --badge-bg: rgba(234, 88, 12, 0.18);
        --badge-text: #fdba74;
        --badge-border: rgba(234, 88, 12, 0.4);
        --shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.2);
        --shadow-hover: 0 8px 16px -2px rgba(0, 0, 0, 0.35);
      }
    }

    /* 手動強制切換至暗黑模式 (灰灰地質感，唔會死黑) */
    [data-theme="dark"] {
      --bg-color: #1e2430;
      --card-bg: #283040;
      --card-border: #374151;
      --card-hover-border: #64748b;
      --card-hover-bg: #2d3748;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --btn-bg: #222938;
      --btn-border: #374151;
      --btn-active-bg: #334155;
      --accent: #60a5fa;
      --badge-bg: rgba(234, 88, 12, 0.18);
      --badge-text: #fdba74;
      --badge-border: rgba(234, 88, 12, 0.4);
      --shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.2);
      --shadow-hover: 0 8px 16px -2px rgba(0, 0, 0, 0.35);
    }

    /* 手動強制切換至明亮模式 */
    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover-border: #94a3b8;
      --card-hover-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --btn-bg: #f1f5f9;
      --btn-border: #cbd5e1;
      --btn-active-bg: #e2e8f0;
      --accent: #2563eb;
      --badge-bg: #fff7ed;
      --badge-text: #ea580c;
      --badge-border: #fed7aa;
      --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 6px 12px -2px rgba(0, 0, 0, 0.08), 0 3px 6px -3px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
    }

    .top-bar {
      width: 100%;
      max-width: 580px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
    }

    /* 左上角主題切換 */
    .theme-toggle-group {
      display: inline-flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 9999px;
      padding: 3px;
      gap: 2px;
      box-shadow: var(--shadow);
    }

    .theme-btn {
      background: transparent;
      border: none;
      border-radius: 9999px;
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .theme-btn.active {
      background: var(--btn-active-bg);
      color: var(--text-main);
    }

    .theme-btn svg {
      width: 18px;
      height: 18px;
    }

    /* 右上角語言切換 */
    .lang-toggle-group {
      display: inline-flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 9999px;
      padding: 3px;
      gap: 2px;
      box-shadow: var(--shadow);
    }

    .lang-btn {
      background: transparent;
      border: none;
      border-radius: 9999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
    }

    .lang-btn.active {
      background: var(--btn-active-bg);
      color: var(--text-main);
    }

    /* 主內容容器 */
    .container {
      width: 100%;
      max-width: 580px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-section {
      text-align: center;
      margin-bottom: 32px;
    }

    /* Avatar 預設樣式（已在下方 HTML 註解隱藏） */
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      color: #ffffff;
      font-weight: 700;
      font-size: 28px;
      box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* 工具連結列表 */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .tool-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: var(--shadow);
    }

    .tool-card:hover {
      border-color: var(--card-hover-border);
      background-color: var(--card-hover-bg);
      box-shadow: var(--shadow-hover);
    }

    .tool-card:hover .tool-title {
      font-weight: 700;
      color: var(--text-main);
    }

    .tool-card:hover .tool-arrow {
      color: var(--text-main);
      transform: translateX(4px);
    }

    .tool-main-content {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    /* 工具 Icon */
    .tool-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      background-color: var(--btn-bg);
      border: 1px solid var(--card-border);
    }

    .tool-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .tool-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      transition: font-weight 0.15s ease, color 0.15s ease;
    }

    /* 亮眼橙色 NEW Tag 標籤 */
    .badge-new {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 9999px;
      background-color: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--badge-border);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 1;
      white-space: nowrap;
    }

    .badge-new svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .tool-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .tool-arrow {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      margin-left: 12px;
      flex-shrink: 0;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    /* 頁尾 Contact 按鈕 */
    footer {
      margin-top: 48px;
      text-align: center;
      width: 100%;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      box-shadow: var(--shadow);
    }

    .contact-link:hover {
      color: var(--text-main);
      border-color: var(--card-hover-border);
      background-color: var(--card-hover-bg);
      box-shadow: var(--shadow-hover);
    }

    .contact-link svg {
      width: 16px;
      height: 16px;
    }

    .copyright {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <!-- 頂部列：左上角主題切換，右上角語言切換 -->
  <div class="top-bar">
    <!-- 主題切換 (SVG 圖示) -->
    <div class="theme-toggle-group" role="group" aria-label="Theme Switcher">
      <button class="theme-btn" id="lightBtn" title="Light Mode" onclick="handleUserThemeToggle('light')">
        <!-- 太陽圖示 -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
      <button class="theme-btn" id="darkBtn" title="Dark Mode" onclick="handleUserThemeToggle('dark')">
        <!-- 月亮圖示 -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <!-- 語言切換 (繁中 (香港) / EN) -->
    <div class="lang-toggle-group" role="group" aria-label="Language Selector">
      <button class="lang-btn active" id="langZh" onclick="setLanguage('zh')">繁中 (香港)</button>
      <button class="lang-btn" id="langEn" onclick="setLanguage('en')">EN</button>
    </div>
  </div>

  <!-- 主內容區 -->
  <main class="container">
    <div class="header-section">
      <!-- <div class="avatar">R</div> -->
      <h1 data-key="mainTitle">Ricky-lk's Tools</h1>
      <p class="subtitle" data-key="mainSubtitle">精選實用工具與計算機</p>
    </div>

    <div class="links-list">
      
      <!-- 工具 1: Insight Pass 回本計數機 -->
      <a href="/insight-pass-calculator" target="_blank" class="tool-card">
        <div class="tool-main-content">
          <!-- 工具 Icon 圖片 -->
          <img src="/insight-pass-calculator/icon.png" alt="Insight Pass Icon" class="tool-icon" onerror="this.style.display='none'">
          
          <div class="tool-info">
            <div class="tool-title-row">
              <span class="tool-title" data-key="tool1Title">Insight Pass 回本計數機</span>
              <!-- NEW Tag -->
              <span class="badge-new">
                <svg viewBox="0 0 24 24">
                  <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"></path>
                </svg>
                <span data-key="badgeNew">NEW</span>
              </span>
            </div>
            <div class="tool-desc" data-key="tool1Desc">
              計算通行證回本進度與回報分析
            </div>
          </div>
        </div>
        <div class="tool-arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </a>

      <!-- 工具 2: OBJ 隱形字元檢測與清理器 -->
      <a href="/obj-cleaner" target="_blank" class="tool-card">
        <div class="tool-main-content">
          <!-- 已複製並預留 Icon 位（URL空白，已使用註解隱藏，日後只需填入 src 即可使用） -->
          <!-- <img src="" alt="OBJ Cleaner Icon" class="tool-icon" onerror="this.style.display='none'"> -->
          
          <div class="tool-info">
            <div class="tool-title-row">
              <span class="tool-title" data-key="tool2Title">OBJ 隱形字元檢測與清理器</span>
            </div>
            <div class="tool-desc" data-key="tool2Desc">
              快速偵測並一鍵清除文字中的隱形特殊符號及亂碼
            </div>
          </div>
        </div>
        <div class="tool-arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </a>

    </div>
  </main>

  <!-- 頁尾：聯絡我們 -->
  <footer>
    <a href="https://tally.so/r/rj9Wdp?tool=home-page" target="_blank" rel="noopener noreferrer" class="contact-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
        <polyline points="22,6 12,13 2,6"></polyline>
      </svg>
      <span data-key="contactUs">聯絡 Contact</span>
    </a>
    <div class="copyright">
      &copy; <span id="year"></span> Ricky-lk. All rights reserved.
    </div>
  </footer>

  <script>
    // 自動更新年份
    document.getElementById('year').textContent = new Date().getFullYear();

    // 中英對照字典
    const translations = {
      zh: {
        mainTitle: "Ricky-lk's Tools",
        mainSubtitle: "精選自製實用工具",
        tool1Title: "Insight Pass 回本計數機",
        tool1Desc: "計算通行證回本進度與回報分析",
        tool2Title: "OBJ 隱形字元檢測與清理器",
        tool2Desc: "快速偵測並一鍵清除文字中的隱形特殊符號及亂碼",
        badgeNew: "全新推出 NEW",
        contactUs: "聯絡"
      },
      en: {
        mainTitle: "Ricky-lk's Tools",
        mainSubtitle: "Handcrafted Practical Tools",
        tool1Title: "Insight Pass Calculator",
        tool1Desc: "Calculate pass payback progress & return analysis",
        tool2Title: "OBJ Character Detector & Cleaner",
        tool2Desc: "Detect and clean invisible special characters & glitches",
        badgeNew: "NEW",
        contactUs: "Contact"
      }
    };

    // ==========================================
    // 🎨 主題管理系統（原生 CSS + 系統偏好雙向同步）
    // ==========================================
    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

    function renderThemeButtons(currentTheme) {
      const lightBtn = document.getElementById('lightBtn');
      const darkBtn = document.getElementById('darkBtn');
      if (currentTheme === 'dark') {
        darkBtn.classList.add('active');
        lightBtn.classList.remove('active');
      } else {
        lightBtn.classList.add('active');
        darkBtn.classList.remove('active');
      }
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      renderThemeButtons(theme);
    }

    // 使用者主動手動點擊按鈕切換
    function handleUserThemeToggle(selectedTheme) {
      localStorage.setItem('preferred-theme', selectedTheme);
      applyTheme(selectedTheme);
    }

    // 取得當前應該生效的主題（若無手動覆蓋，一律回歸系統偏好）
    function resolveEffectiveTheme() {
      const savedTheme = localStorage.getItem('preferred-theme');
      if (savedTheme === 'dark' || savedTheme === 'light') {
        return savedTheme;
      }
      return mediaQuery.matches ? 'dark' : 'light';
    }

    // 監聽作業系統／瀏覽器深淺色模式即時變更
    mediaQuery.addEventListener('change', (e) => {
      // 只有在使用者沒有手動強制鎖定偏好時，自動跟隨系統動態切換
      if (!localStorage.getItem('preferred-theme')) {
        applyTheme(e.matches ? 'dark' : 'light');
      }
    });

    // ==========================================
    // 🌐 語言管理系統
    // ==========================================
    function setLanguage(lang) {
      document.documentElement.lang = lang === 'zh' ? 'zh-HK' : 'en';
      localStorage.setItem('preferred-lang', lang);
      
      const langZh = document.getElementById('langZh');
      const langEn = document.getElementById('langEn');
      
      if (lang === 'en') {
        langEn.classList.add('active');
        langZh.classList.remove('active');
      } else {
        langZh.classList.add('active');
        langEn.classList.remove('active');
      }

      // 更新所有 i18n 元素
      document.querySelectorAll('[data-key]').forEach(elem => {
        const key = elem.getAttribute('data-key');
        if (translations[lang] && translations[lang][key]) {
          elem.textContent = translations[lang][key];
        }
      });
    }

    // 頁面初始化
    (function init() {
      // 1. 初始化主題按鈕狀態（確保與當前生效模式一致）
      const initialTheme = resolveEffectiveTheme();
      applyTheme(initialTheme);

      // 2. 初始化語言
      const savedLang = localStorage.getItem('preferred-lang');
      if (savedLang) {
        setLanguage(savedLang);
      } else {
        const userLang = navigator.language || navigator.userLanguage;
        if (userLang && userLang.toLowerCase().startsWith('zh')) {
          setLanguage('zh');
        } else {
          setLanguage('en');
        }
      }
    })();
  </script>
</body>
</html>
